Global:
  use_gpu: __USE_GPU__
  epoch_num: 200
  save_model_dir: __SAVE_DIR__
  save_epoch_step: 50
  eval_batch_step: [0, 500]
  pretrained_model: __PRETRAINED__
  character_dict_path: ./ppocrv5_latin_dict.txt
  max_text_length: 25
  use_space_char: true
Optimizer:
  name: Adam
  lr: { name: Piecewise, decay_epochs: [140, 180], values: [0.0001, 0.00002], warmup_epoch: 5 }
  regularizer: { name: L2, factor: 0 }
Architecture:
  model_type: rec
  algorithm: SVTR
  Backbone: { name: MobileNetV1Enhance, scale: 0.5, last_conv_stride: [1, 2], last_pool_type: avg }
  Neck: { name: SequenceEncoder, encoder_type: svtr, dims: 64, depth: 2, hidden_dims: 120, use_guide: False }
  Head: { name: CTCHead, fc_decay: 0.00001 }
Loss: { name: CTCLoss }
PostProcess: { name: CTCLabelDecode }
Metric: { name: RecMetric, main_indicator: acc }
Train:
  dataset:
    name: SimpleDataSet
    data_dir: __DATA_DIR__
    label_file_list: [__DATA_DIR__/train_list.txt]
    transforms:
      - DecodeImage: { img_mode: BGR, channel_first: false }
      - RecAug: {}
      - CTCLabelEncode: {}
      - RecResizeImg: { image_shape: [3, 48, 320] }
      - KeepKeys: { keep_keys: [image, label, length] }
  loader: { shuffle: true, batch_size_per_card: 64, drop_last: true, num_workers: 0 }
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: __DATA_DIR__
    label_file_list: [__DATA_DIR__/val_list.txt]
    transforms:
      - DecodeImage: { img_mode: BGR, channel_first: false }
      - CTCLabelEncode: {}
      - RecResizeImg: { image_shape: [3, 48, 320] }
      - KeepKeys: { keep_keys: [image, label, length] }
  loader: { shuffle: false, batch_size_per_card: 64, drop_last: false, num_workers: 0 }
